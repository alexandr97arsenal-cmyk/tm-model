<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Electroscope — Manual TM Loader</title>
<style>
  :root{--bg:#0b1020;--card:#131a2b;--text:#e8ecff;--muted:#9fb3ff;--accent:#7aa2ff;--ok:#38c172;--warn:#ffcc66;--bad:#ff6b6b}
  body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,Segoe UI,Roboto}
  .wrap{max-width:960px;margin:0 auto;padding:16px}
  .card{background:var(--card);border:1px solid rgba(127,127,127,.2);border-radius:18px;padding:14px;margin:12px 0;box-shadow:0 10px 24px rgba(0,0,0,.25)}
  h1{margin:0 0 6px 0;font-size:20px}
  .muted{color:var(--muted);font-size:13px}
  .row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
  input[type="file"],button{border-radius:10px;border:1px solid rgba(127,127,127,.35);padding:8px 10px;background:transparent;color:var(--text)}
  button{background:linear-gradient(135deg,#1e3a8a 0%,#2563eb 100%);color:#ffd400;border-color:rgba(255,212,0,.5);font-weight:700;cursor:pointer}
  button:disabled{opacity:.6;cursor:not-allowed}
  .videoWrap{position:relative;border-radius:14px;overflow:hidden;background:#000}
  video{width:100%;height:auto;display:block}
  .overlay{position:absolute;inset:0;border:3px solid transparent;pointer-events:none;transition:border-color .2s}
  .overlay.good{border-color:rgba(56,193,114,.9)} .overlay.warn{border-color:rgba(255,204,102,.9)} .overlay.bad{border-color:rgba(255,107,107,.9)}
  .bars{display:grid;gap:8px}
  .barRow{display:flex;align-items:center;gap:8px}
  .bar{flex:1;height:12px;background:rgba(127,127,127,.25);border-radius:999px;overflow:hidden}
  .fill{height:100%;width:0%;background:var(--accent);transition:width .5s}
  .label{min-width:120px;font-size:13px} .val{min-width:54px;text-align:right;font-size:13px}
  .pill{padding:6px 10px;border-radius:999px;font-weight:800}
  .pill.good{background:#0f2f26;color:#a1f0c4} .pill.mid{background:#2a2a10;color:#fff3a1} .pill.bad{background:#3a1316;color:#ffb3b3}
  .gauge{position:relative;height:140px;margin:10px 0} .gauge svg{width:100%;height:100%} .needle{transform-origin:50% 90%;transition:transform .6s}
  .status{font-size:13px;color:var(--muted)} .error{color:#ffb3b3;white-space:pre-wrap}
</style>
</head>
<body>
<div class="wrap">
  <div class="card">
    <h1>Electroscope — Загрузка модели вручную</h1>
    <div class="muted">Выбери три файла из Teachable Machine: <code>model.json</code>, <code>weights.bin</code>, <code>metadata.json</code></div>
    <div class="row" style="margin-top:8px">
      <div>
        <div class="muted">model.json</div>
        <input id="fModel" type="file" accept=".json"/>
      </div>
      <div>
        <div class="muted">weights.bin</div>
        <input id="fWeights" type="file" accept=".bin"/>
      </div>
      <div>
        <div class="muted">metadata.json</div>
        <input id="fMeta" type="file" accept=".json"/>
      </div>
      <div style="align-self:end">
        <button id="btnLoad" disabled>Загрузить модель</button>
      </div>
    </div>
    <div class="row" style="margin-top:8px">
      <button id="btnStart" disabled>▶️ Включить камеру</button>
      <button id="btnFlip" disabled>🔄 Сменить камеру</button>
      <button id="btnSnap" disabled>📸 Снимок</button>
      <input id="imgFile" type="file" accept="image/*" disabled/>
    </div>
    <div class="status" id="status">Модель не загружена.</div>
    <div class="error" id="error"></div>
  </div>

  <div class="card">
    <div class="videoWrap">
      <video id="video" autoplay playsinline muted></video>
      <div id="overlay" class="overlay"></div>
    </div>
  </div>

  <div class="card" id="result" style="display:none">
    <div id="headline" class="pill mid">Ожидаем…</div>
    <div class="gauge">
      <svg viewBox="0 0 200 120">
        <path d="M20 100 A80 80 0 0 1 180 100" fill="none" stroke="rgba(127,127,127,.4)" stroke-width="12"/>
        <g class="needle" id="needle" transform="rotate(0 100 100)">
          <rect x="98" y="30" width="4" height="72" fill="#7aa2ff" rx="2"/>
          <circle cx="100" cy="100" r="6" fill="#7aa2ff"/>
        </g>
      </svg>
    </div>
    <div class="bars" id="bars"></div>
    <div class="status" id="tip"></div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@3.21.0/dist/tf.min.js"></script>
<script>
(() => {
  const fModel = document.getElementById('fModel');
  const fWeights = document.getElementById('fWeights');
  const fMeta = document.getElementById('fMeta');
  const btnLoad = document.getElementById('btnLoad');
  const btnStart = document.getElementById('btnStart');
  const btnFlip = document.getElementById('btnFlip');
  const btnSnap = document.getElementById('btnSnap');
  const imgFile = document.getElementById('imgFile');
  const statusEl = document.getElementById('status');
  const errorEl = document.getElementById('error');
  const resultBox = document.getElementById('result');
  const barsBox = document.getElementById('bars');
  const headline = document.getElementById('headline');
  const needle = document.getElementById('needle');
  const tip = document.getElementById('tip');
  const video = document.getElementById('video');
  const overlay = document.getElementById('overlay');

  let model = null;
  let labels = [];
  let stream = null;
  let facing = 'environment';

  function setStatus(s){ statusEl.textContent = s; }
  function setError(e){ errorEl.textContent = e || ''; }

  function toggleBtn(){
    btnLoad.disabled = !(fModel.files[0] && fWeights.files[0] && fMeta.files[0]);
  }
  fModel.addEventListener('change', toggleBtn);
  fWeights.addEventListener('change', toggleBtn);
  fMeta.addEventListener('change', toggleBtn);

  function readJSON(file){
    return new Promise((resolve,reject)=>{
      const r = new FileReader();
      r.onload = ()=>{ try{ resolve(JSON.parse(r.result)); }catch(e){ reject(e);} };
      r.onerror = reject;
      r.readAsText(file);
    });
  }

  function preprocess(el){
    const shp = model.inputs[0].shape; // [null, H, W, 3]
    const H = shp[1] || 224, W = shp[2] || 224;
    return tf.tidy(()=>{
      let t = tf.browser.fromPixels(el);
      t = tf.image.resizeBilinear(t, [H,W], true);
      t = t.toFloat().div(127.5).sub(1);
      return t.expandDims(0);
    });
  }

  function setNeedle(prob){ const angle = -70 + Math.max(0,Math.min(1,prob))*140; needle.style.transform = `rotate(${angle} 100 100)`; }

  function render(arr){
    resultBox.style.display='block';
    barsBox.innerHTML='';
    const pairs = labels.map((name,i)=>({name, p: arr[i]||0})).sort((a,b)=>b.p-a.p);
    const top = pairs[0];
    const pct = (top.p*100).toFixed(1);
    let mood='bad', pill='pill bad', msg='Низкая уверенность — улучшите освещение.';
    if(top.p>=0.8){ mood='good'; pill='pill good'; msg='Высокая уверенность.'; }
    else if(top.p>=0.5){ mood='warn'; pill='pill mid'; msg='Средняя уверенность — сделайте ещё кадр.'; }
    overlay.className='overlay ' + (mood==='good'?'good':mood==='warn'?'warn':'bad');
    headline.className=pill; headline.textContent = `${top.name} — ${pct}%`;
    setNeedle(top.p);
    pairs.forEach(({name,p})=>{
      const row=document.createElement('div'); row.className='barRow';
      const lab=document.createElement('div'); lab.className='label'; lab.textContent=name;
      const bar=document.createElement('div'); bar.className='bar';
      const fill=document.createElement('div'); fill.className='fill';
      const val=document.createElement('div'); val.className='val'; val.textContent=(p*100).toFixed(1)+'%';
      bar.appendChild(fill); row.append(lab,bar,val); barsBox.appendChild(row);
      requestAnimationFrame(()=>{ fill.style.width=(p*100).toFixed(1)+'%'; });
    });
  }

  async function predictFrom(el){
    const x = preprocess(el);
    let out = model.predict(x); // Tensor or array
    if(Array.isArray(out)) out = out[0];
    let arr = await out.data();
    arr = Array.from(arr);
    // Normalize to probabilities if needed
    const s = arr.reduce((a,b)=>a+b,0);
    if(s>1.01){ // apply softmax if logits
      const t = tf.tensor(arr); const sm = tf.softmax(t).arraySync(); t.dispose();
      arr = sm;
    }
    tf.dispose([x,out]);
    render(arr);
  }

  btnLoad.addEventListener('click', async ()=>{
    try{
      setError(''); setStatus('Загружаю модель из файлов…');
      model = await tf.loadLayersModel(tf.io.browserFiles([fModel.files[0], fWeights.files[0]]));
      const meta = await readJSON(fMeta.files[0]);
      labels = (meta && Array.isArray(meta.labels)) ? meta.labels : Array.from({length: model.outputs[0].shape[1]||6}, (_,i)=>'Class '+(i+1));
      setStatus(`Модель загружена. Классов: ${labels.length}`);
      btnStart.disabled=false; btnFlip.disabled=false; btnSnap.disabled=false; imgFile.disabled=false;
    }catch(e){
      console.error(e);
      setError('Ошибка загрузки: ' + (e?.message||e));
      setStatus('Модель не загружена.');
    }
  });

  async function startCam(){
    try{
      if(stream){ stream.getTracks().forEach(t=>t.stop()); stream=null; }
      const cons = {video:{facingMode:{exact:facing}}, audio:false};
      stream = await navigator.mediaDevices.getUserMedia(cons);
      video.srcObject = stream; await video.play();
      setStatus('Камера включена.');
    }catch(e){
      try{
        const fb = {video:{facingMode:(facing==='environment'?'user':'environment')}, audio:false};
        stream = await navigator.mediaDevices.getUserMedia(fb);
        facing=(facing==='environment'?'user':'environment');
        video.srcObject = stream; await video.play();
        setStatus('Включена другая камера (fallback).');
      }catch(e2){
        setError('Не удалось включить камеру. Нужен HTTPS и разрешение.');
      }
    }
  }
  btnStart.addEventListener('click', startCam);
  btnFlip.addEventListener('click', async ()=>{ facing=(facing==='environment'?'user':'environment'); await startCam(); });
  btnSnap.addEventListener('click', async ()=>{
    if(!model){ setError('Сначала загрузите модель.'); return; }
    if(!video.videoWidth){ setError('Камера не готова.'); return; }
    const c=document.createElement('canvas'); c.width=video.videoWidth; c.height=video.videoHeight;
    c.getContext('2d').drawImage(video,0,0);
    await predictFrom(c);
  });
  imgFile.addEventListener('change', async (e)=>{
    if(!model){ setError('Сначала загрузите модель.'); return; }
    const f = e.target.files && e.target.files[0]; if(!f) return;
    const url = URL.createObjectURL(f);
    const img = new Image();
    img.onload = async ()=>{ URL.revokeObjectURL(url); await predictFrom(img); };
    img.src = url;
  });
})();
</script>
</body>
</html>
